name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 10.34.3 # same as .mise.toml
                  cache: true

            - uses: actions/setup-node@v7
              with:
                  node-version: 22 # same as .mise.toml

            - run: pnpm install --frozen-lockfile

            - id: pages
              uses: actions/configure-pages@v6

            - name: Build
              run: pnpm run build
              env:
                  # "/<repo>" for a project site, "" for <user>.github.io or a custom domain
                  FIGMA_PUBLIC_URL: ${{ steps.pages.outputs.base_path }}

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist

            - id: deployment
              uses: actions/deploy-pages@v5
